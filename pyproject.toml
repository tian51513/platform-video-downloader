[project]
name = "platform-video-downloader"
version = "0.1.0"
description = "多平台视频批量下载器 (Bilibili + YouTube)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "playwright>=1.40",
    "yt-dlp>=2024.0",
    "imageio-ffmpeg>=0.5",
    "pywin32>=306; sys_platform == 'win32'",
    "browser-cookie3>=0.20; sys_platform == 'win32'",
]

[project.scripts]
pvd = "platform_video_downloader.cli.main:cli_entry"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_video_downloader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
